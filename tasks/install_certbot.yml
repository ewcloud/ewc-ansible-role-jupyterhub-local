---
- name: Enable CRB/EPEL for RHEL-based platforms
  when: ansible_os_family == "RedHat"

  block:
    - name: Ensure EPEL repo is enabled
      ansible.builtin.dnf:
        name: epel-release
        state: latest

    - name: Check if CRB is enabled for el9+ variants
      ansible.builtin.command:
        cmd: dnf repolist crb --enabled
      register: repolist
      changed_when: false

    - name: Enable CRB repository for el9+ variants
      ansible.builtin.command:
        cmd: dnf config-manager --enable crb
      when: "'crb' not in repolist.stdout"

- name: Setup HTTP(S) firewall rules for RHEL-based platforms
  when: ansible_os_family == "RedHat"

  block:
    - name: "Allow traffic in default firewall zone for {{ item }}"
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https
- name: Ensure snap is installed
  ansible.builtin.package:
    name: snapd
    state: present

- name: Ensure snapd is enabled
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: true
    state: started

- name: Enable classic snap support
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: ansible_os_family != "Debian"

- name: Ensure snap core is present
  community.general.snap:
    name: core
    state: present

- name: Ensure certbot is not installed via system
  ansible.builtin.package:
    name: certbot
    state: absent

- name: Install Certbot via snap
  community.general.snap:
    name: certbot
    state: present
    classic: true

- name: Make certbot executable available
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link

- when: dns_domain is not defined
  block:
    - name: Get FQDN for the host
      ansible.builtin.command: hostname -f
      register: hostname_out
      changed_when: false

    - name: Extract FQDN
      ansible.builtin.set_fact:
        host_fqdn: "{{ hostname_out.stdout }}"

- name: Construct FQDN for the host
  ansible.builtin.set_fact:
    host_fqdn: "{{ ansible_hostname }}.{{ dns_domain }}"
  when: dns_domain is defined

- name: Set Cert paths
  ansible.builtin.set_fact:
    ssl_key: "/etc/letsencrypt/live/{{ host_fqdn }}/privkey.pem"
    ssl_cert: "/etc/letsencrypt/live/{{ host_fqdn }}/fullchain.pem"

- name: "Setup Certbot to generate and renew SSL certificate for {{ host_fqdn }} as {{ jupyterhub_local_cert_email}}"
  ansible.builtin.command:
    cmd: /usr/bin/certbot certonly{{ ' --test-cert ' if jupyterhub_local_test_cert else ' ' }}--standalone --noninteractive --agree-tos --email {{ jupyterhub_local_cert_email }} -d {{ host_fqdn }}
    creates: "{{ ssl_key }}"
